  <text x="8" y="91" font-size="19">Prompt</text>
  <text x="144" y="91" font-size="19" text-anchor="middle">model</text>
  <text x="260" y="31" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">1<tspan font-size="11" fill="#555">, 0:16k</tspan></tspan></text>
  <text x="260" y="71" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">2<tspan font-size="11" fill="#555">, 0:16k</tspan></tspan></text>
  <text x="260" y="111" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">3<tspan font-size="11" fill="#555">, 0:16k</tspan></tspan></text>
  <text x="260" y="151" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">4<tspan font-size="11" fill="#555">, 0:16k</tspan></tspan></text>
  <text x="449" y="77" font-size="15" font-style="italic" text-anchor="middle">0/4 correct:</text>
  <text x="449" y="105" font-size="15" font-style="italic" text-anchor="middle">sample 3 more</text>
  <text x="449" y="124" font-size="15" font-style="italic" text-anchor="middle">and continue y<tspan dy="4" font-size="11">1</tspan></text>
  <text x="560" y="91" font-size="19" text-anchor="middle">model</text>
  <text x="676" y="31" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">1<tspan font-size="11" fill="#555">, 16k:32k</tspan></tspan></text>
  <text x="676" y="71" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">5<tspan font-size="11" fill="#555">, 0:16k</tspan></tspan></text>
  <text x="676" y="111" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">6<tspan font-size="11" fill="#555">, 0:16k</tspan></tspan></text>
  <text x="676" y="151" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">7<tspan font-size="11" fill="#555">, 0:16k</tspan></tspan></text>

  <!-- marks: green check = correct, red cross = wrong, amber dots = truncated -->
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="336" cy="28" r="1.8" fill="#b07d12" stroke="none"/>
    <circle cx="342" cy="28" r="1.8" fill="#b07d12" stroke="none"/>
    <circle cx="348" cy="28" r="1.8" fill="#b07d12" stroke="none"/>
    <path d="M337,60 L347,70 M347,60 L337,70" stroke="#b23a2e"/>
    <path d="M337,100 L347,110 M347,100 L337,110" stroke="#b23a2e"/>
    <path d="M337,140 L347,150 M347,140 L337,150" stroke="#b23a2e"/>
    <path d="M752,25 L757,30 L765,19" stroke="#2e7d32"/>
    <path d="M753,60 L763,70 M763,60 L753,70" stroke="#b23a2e"/>
    <path d="M753,100 L763,110 M763,100 L753,110" stroke="#b23a2e"/>
    <path d="M753,140 L763,150 M763,140 L753,150" stroke="#b23a2e"/>
