    <line x1="628" y1="25" x2="628" y2="145"/>
    <line x1="628" y1="25" x2="662" y2="25" marker-end="url(#arrow)"/>
    <line x1="628" y1="65" x2="662" y2="65" marker-end="url(#arrow)"/>
    <line x1="628" y1="105" x2="662" y2="105" marker-end="url(#arrow)"/>
    <line x1="628" y1="145" x2="662" y2="145" marker-end="url(#arrow)"/>
  </g>

  <!-- dashed box = ran out of tokens before answering -->
  <g stroke="#555" stroke-width="1.2">
    <rect x="102" y="62" width="84" height="46" rx="6" fill="#f1f0e8"/>
    <rect x="250" y="9" width="108" height="32" rx="5" fill="#fffff8" stroke-dasharray="4 3"/>
    <rect x="250" y="49" width="108" height="32" rx="5" fill="#fffff8"/>
    <rect x="250" y="89" width="108" height="32" rx="5" fill="#fffff8"/>
    <rect x="250" y="129" width="108" height="32" rx="5" fill="#fffff8"/>
    <rect x="518" y="62" width="84" height="46" rx="6" fill="#f1f0e8"/>
    <rect x="666" y="9" width="108" height="32" rx="5" fill="#fffff8"/>
    <rect x="666" y="49" width="108" height="32" rx="5" fill="#fffff8"/>
    <rect x="666" y="89" width="108" height="32" rx="5" fill="#fffff8"/>
    <rect x="666" y="129" width="108" height="32" rx="5" fill="#fffff8"/>
