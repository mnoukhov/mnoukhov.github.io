<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 170" width="302" height="170"
     font-family="et-book, Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" fill="#111">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#111"/>
    </marker>
  </defs>

  <g stroke="#111" stroke-width="1.3" fill="none">
    <!-- prompt -> model -->
    <line x1="74" y1="75" x2="98" y2="75" marker-end="url(#arrow)"/>
    <!-- model -> fan out -->
    <line x1="186" y1="75" x2="212" y2="75"/>
    <line x1="212" y1="25" x2="212" y2="145"/>
    <line x1="212" y1="25"  x2="246" y2="25"  marker-end="url(#arrow)"/>
    <line x1="212" y1="75"  x2="246" y2="75"  marker-end="url(#arrow)"/>
    <line x1="212" y1="145" x2="246" y2="145" marker-end="url(#arrow)"/>
  </g>
  <!-- vertical dots between y_2 and y_K -->
  <g fill="#111">
    <circle cx="272" cy="102" r="2"/>
    <circle cx="272" cy="110" r="2"/>
    <circle cx="272" cy="118" r="2"/>
  </g>

  <!-- boxes -->
  <g stroke="#555" stroke-width="1.2">
    <rect x="102" y="52" width="84" height="46" rx="6" fill="#f1f0e8"/>
    <g fill="#fffff8">
      <rect x="250" y="9"   width="44" height="32" rx="5"/>
      <rect x="250" y="59"  width="44" height="32" rx="5"/>
      <rect x="250" y="129" width="44" height="32" rx="5"/>
    </g>
  </g>

  <!-- labels -->
  <text x="8" y="81" font-size="19">Prompt</text>
  <text x="144" y="81" font-size="19" text-anchor="middle">model</text>

  <g font-size="21" font-style="italic" text-anchor="middle">
    <text x="270" y="31">y<tspan dy="5" font-size="13" font-style="normal">1</tspan></text>
    <text x="270" y="81">y<tspan dy="5" font-size="13" font-style="normal">2</tspan></text>
    <text x="270" y="151">y<tspan dy="5" font-size="13">K</tspan></text>
  </g>
</svg>
