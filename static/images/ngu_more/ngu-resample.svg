  <text x="8" y="81" font-size="19">Prompt</text>
  <text x="144" y="81" font-size="19" text-anchor="middle">model</text>
  <text x="260" y="31" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">1</tspan></text>
  <text x="260" y="81" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal">2</tspan></text>
  <text x="260" y="151" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal"><tspan font-style="italic">K</tspan>/4</tspan></text>
  <text x="441" y="67" font-size="15" font-style="italic" text-anchor="middle">none correct:</text>
  <text x="441" y="95" font-size="15" font-style="italic" text-anchor="middle">sample <tspan font-style="italic">K</tspan>/4 more</text>
  <text x="560" y="81" font-size="19" text-anchor="middle">model</text>
  <text x="676" y="31" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal"><tspan font-style="italic">K</tspan>/4+1</tspan></text>
  <text x="676" y="81" font-size="21" font-style="italic">y<tspan dy="5" font-size="13" font-style="normal"><tspan font-style="italic">K</tspan>/4+2</tspan></text>
