<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 584 170" width="584" height="170"
     font-family="et-book, Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" fill="#111">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#111"/>
    </marker>
  </defs>

  <g stroke="#111" stroke-width="1.3" fill="none">
    <!-- prompt -> model 1 -->
    <line x1="74" y1="75" x2="98" y2="75" marker-end="url(#arrow)"/>

    <!-- round 1: fan out / fan in -->
    <line x1="186" y1="75" x2="212" y2="75"/>
    <line x1="212" y1="25" x2="212" y2="145"/>
    <line x1="212" y1="25"  x2="246" y2="25"  marker-end="url(#arrow)"/>
    <line x1="212" y1="75"  x2="246" y2="75"  marker-end="url(#arrow)"/>
    <line x1="212" y1="145" x2="246" y2="145" marker-end="url(#arrow)"/>
    <line x1="306" y1="25"  x2="332" y2="25"/>
    <line x1="306" y1="75"  x2="332" y2="75"/>
    <line x1="306" y1="145" x2="332" y2="145"/>
    <line x1="332" y1="25" x2="332" y2="145"/>
    <line x1="332" y1="75" x2="366" y2="75" marker-end="url(#arrow)"/>

    <!-- round 2: fan out / fan in -->
    <line x1="454" y1="75" x2="480" y2="75"/>
    <line x1="480" y1="25" x2="480" y2="145"/>
    <line x1="480" y1="25"  x2="514" y2="25"  marker-end="url(#arrow)"/>
    <line x1="480" y1="75"  x2="514" y2="75"  marker-end="url(#arrow)"/>
    <line x1="480" y1="145" x2="514" y2="145" marker-end="url(#arrow)"/>

  </g>
  <!-- vertical dots between y_2 and y_K -->
  <g fill="#111">
    <circle cx="282" cy="102" r="2"/><circle cx="282" cy="110" r="2"/><circle cx="282" cy="118" r="2"/>
    <circle cx="550" cy="102" r="2"/><circle cx="550" cy="110" r="2"/><circle cx="550" cy="118" r="2"/>
  </g>

  <!-- boxes -->
  <g stroke="#555" stroke-width="1.2">
    <rect x="102" y="52" width="84" height="46" rx="6" fill="#f1f0e8"/>
    <rect x="370" y="52" width="84" height="46" rx="6" fill="#f1f0e8"/>
    <g fill="#fffff8">
      <rect x="250" y="9"   width="56" height="32" rx="5"/>
      <rect x="250" y="59"  width="56" height="32" rx="5"/>
      <rect x="250" y="129" width="56" height="32" rx="5"/>
      <rect x="518" y="9"   width="56" height="32" rx="5"/>
      <rect x="518" y="59"  width="56" height="32" rx="5"/>
      <rect x="518" y="129" width="56" height="32" rx="5"/>
    </g>
  </g>

  <!-- labels -->
  <text x="8" y="81" font-size="19">Prompt</text>
  <g font-size="19" text-anchor="middle">
    <text x="144" y="81">model</text>
    <text x="412" y="81">model</text>
  </g>

  <!-- y symbols -->
  <g font-size="21" font-style="italic">
    <text x="260" y="31">y</text>
    <text x="260" y="81">y</text>
    <text x="260" y="151">y</text>
    <text x="528" y="31">y</text>
    <text x="528" y="81">y</text>
    <text x="528" y="151">y</text>
  </g>
  <!-- superscripts: round -->
  <g font-size="13">
    <text x="272" y="22">(1)</text>
    <text x="272" y="72">(1)</text>
    <text x="272" y="142">(1)</text>
    <text x="540" y="22">(2)</text>
    <text x="540" y="72">(2)</text>
    <text x="540" y="142">(2)</text>
  </g>
  <!-- subscripts: sample -->
  <g font-size="13">
    <text x="272" y="37">1</text>
    <text x="272" y="87">2</text>
    <text x="272" y="157" font-style="italic">K</text>
    <text x="540" y="37">1</text>
    <text x="540" y="87">2</text>
    <text x="540" y="157" font-style="italic">K</text>
  </g>
</svg>
